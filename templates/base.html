<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lớp tập huấn bồi dưỡng kiến thức công nghệ thông tin, trí tuệ nhân tạo">
    <title>{% block title %}SGU{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="navbar">
            <a class="brand" href="{{ url_for('home') }}" aria-label="Model Hub - Trang chủ">
                <span class="brand-mark" aria-hidden="true">
                    <img src="{{ url_for('static', filename='images/SGU-LOGO.png') }}" alt="">
                </span>
                <!-- <span>SGU</span> -->
            </a>
            <p class="header-training-title">
                <span>LỚP TẬP HUẤN BỒI DƯỠNG KIẾN THỨC</span>
                <span>CÔNG NGHỆ THÔNG TIN, TRÍ TUỆ NHÂN TẠO</span>
            </p>
            <nav class="nav-links" aria-label="Điều hướng chính">
                <a href="{{ url_for('home') }}"{% if active_page == 'home' %} class="active" aria-current="page"{% endif %}>Trang chủ</a>
                <a href="{{ url_for('download_page') }}"{% if active_page == 'download' %} class="active" aria-current="page"{% endif %}>Tải model</a>
                <a href="{{ url_for('files_page') }}"{% if active_page == 'files' %} class="active" aria-current="page"{% endif %}>Tải tệp</a>
                <a href="{{ url_for('upload_page') }}"{% if active_page == 'upload' %} class="active" aria-current="page"{% endif %}>Nộp bài</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
