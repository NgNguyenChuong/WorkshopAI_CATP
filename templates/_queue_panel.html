<section class="queue-panel" data-download-queue aria-live="polite" hidden>
    <div class="queue-indicator" aria-hidden="true">
        <span></span>
    </div>
    <div class="queue-copy">
        <p class="eyebrow">HÀNG ĐỢI TẢI XUỐNG</p>
        <h2 data-queue-title>Đang xếp hàng</h2>
        <p data-queue-message>Đang kết nối với máy chủ…</p>
        <dl class="queue-stats" data-queue-stats hidden>
            <div>
                <dt>Vị trí của bạn</dt>
                <dd data-queue-position>—</dd>
            </div>
            <div>
                <dt>Slot đã cấp</dt>
                <dd><span data-queue-active>—</span>/<span data-queue-slots>—</span></dd>
            </div>
            <div>
                <dt>Đang chờ</dt>
                <dd data-queue-waiting>—</dd>
            </div>
        </dl>
        <div class="queue-actions">
            <button class="button button-blue" type="button" data-queue-retry hidden>Tải lại</button>
            <button class="button button-ghost" type="button" data-queue-cancel>Hủy xếp hàng</button>
        </div>
    </div>
</section>
